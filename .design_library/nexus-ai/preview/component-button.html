<link rel="stylesheet" href="../colors_and_type.css">
<style>
/* Page scaffold */
body { margin:0; padding:12px; background:var(--color-background); font-family:var(--font-sans); color:var(--color-foreground); }
.row { display:flex; gap:8px; align-items:center; margin-bottom:8px; flex-wrap:wrap; }
.label { font-size:var(--type-eyebrow); font-weight:var(--font-weight-semibold); text-transform:uppercase; letter-spacing:var(--letter-spacing-marquee-label); color:var(--color-muted-foreground); width:92px; }
.divider { border:0; border-top:1px solid var(--color-border); margin:12px 0; }

/* @component-css-start */
.btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; height:var(--size-button-height); min-width:var(--size-button-height); padding:0 24px; border:1px solid transparent; border-radius:var(--radius-lg); font-family:var(--font-sans); font-size:var(--type-body); font-weight:var(--font-weight-semibold); line-height:1; white-space:nowrap; cursor:pointer; transition:background .15s,border-color .15s,box-shadow .15s; }
.btn-primary { background:var(--color-primary); color:var(--color-primary-foreground); box-shadow:var(--shadow-3); }
.btn-primary:hover { filter:brightness(1.08); }
.btn-secondary { background:var(--color-card); color:var(--color-card-foreground); border-color:var(--color-border); box-shadow:var(--shadow-2); }
.btn-secondary:hover { background:var(--color-accent); }
.btn-ghost { background:transparent; color:var(--color-foreground); height:var(--size-nav-cta); padding:0 16px; border-radius:var(--radius-md); }
.btn-ghost:hover { background:var(--color-accent); }
.btn-destructive { background:var(--color-destructive); color:var(--color-primary-foreground); }
.btn-destructive:hover { filter:brightness(1.08); }
.btn:focus-visible { outline:2px solid var(--nexus-signal); outline-offset:var(--size-outline-offset); }
.btn[disabled], .btn.is-disabled { opacity:.5; cursor:not-allowed; box-shadow:none; }
/* @component-css-end */
</style>

<div class="row"><span class="label">Variantes</span>
<button class="btn btn-primary" type="button">Começar agora</button>
<button class="btn btn-secondary" type="button">Ver demonstração</button>
<button class="btn btn-ghost" type="button">Saiba mais</button>
<button class="btn btn-destructive" type="button">Encerrar sessão</button>
</div>

<hr class="divider">

<div class="row"><span class="label">Estados</span>
<button class="btn btn-primary" type="button">Começar agora</button>
<button class="btn btn-primary" type="button" autofocus>Em foco</button>
<button class="btn btn-primary" type="button" disabled>Em breve</button>
</div>
