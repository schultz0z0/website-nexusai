<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Campo de formulário</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { margin: 0; padding: var(--space-7); background: var(--color-background); font-family: var(--font-sans); color: var(--color-foreground); }
.row { display: flex; gap: var(--space-9); align-items: flex-start; margin-bottom: var(--space-9); flex-wrap: wrap; }
.label { font-size: var(--type-eyebrow); text-transform: uppercase; letter-spacing: var(--letter-spacing-marquee-label); color: var(--color-muted-foreground); min-width: 92px; padding-top: var(--space-4); }
hr.divider { border: 0; border-top: var(--space-1) solid var(--color-border); margin: var(--space-12) 0; }
.grid { display: grid; gap: var(--space-9); grid-template-columns: repeat(2, minmax(0, 1fr)); width: 100%; }
.col { display: flex; flex-direction: column; gap: var(--space-12); min-width: 0; }
.full { width: 100%; }

/* @component-css-start */
.field { display: flex; flex-direction: column; gap: var(--space-4); min-width: 120px; }
.field-label { font-size: var(--type-caption); font-weight: var(--font-weight-medium); color: var(--color-foreground); display: inline-flex; align-items: center; gap: var(--space-3); }
.field-label .req { color: var(--color-destructive); font-weight: var(--font-weight-semibold); }
.field-hint { font-size: var(--type-caption); color: var(--color-muted-foreground); line-height: var(--line-height-caption); }
.field-error { font-size: var(--type-caption); color: var(--color-destructive); line-height: var(--line-height-caption); display: inline-flex; align-items: center; gap: var(--space-3); }
.input, .select, .textarea {
  width: 100%; box-sizing: border-box; font: inherit; color: var(--color-foreground);
  background: var(--color-card); border: var(--space-1) solid var(--color-border);
  border-radius: var(--radius-md); padding: var(--space-7) var(--space-9);
  transition: border-color .15s, box-shadow .15s; min-width: 0;
}
.input { height: var(--size-input-height); }
.select { height: var(--size-input-height); appearance: none; padding-right: var(--space-14); }
.textarea { min-height: 96px; resize: vertical; line-height: var(--line-height-body); }
.input::placeholder, .textarea::placeholder { color: var(--color-muted-foreground); }
.input:hover, .select:hover, .textarea:hover { border-color: var(--color-ring); }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--color-ring); box-shadow: 0 0 0 3px var(--nexus-signal-soft); }
.input.is-invalid, .select.is-invalid, .textarea.is-invalid { border-color: var(--color-destructive); }
.input.is-invalid:focus, .select.is-invalid:focus, .textarea.is-invalid:focus { box-shadow: 0 0 0 3px rgba(219, 29, 29, 0.18); }
.input[aria-invalid="true"] { border-color: var(--color-destructive); }
.input[disabled], .select[disabled], .textarea[disabled] { background: var(--color-muted); color: var(--color-muted-foreground); cursor: not-allowed; }
/* @component-css-end */
</style>
</head>
<body>

<div class="row">
  <span class="label">Entradas</span>
  <div class="grid">
    <div class="col">
      <div class="field">
        <label class="field-label" for="nome">Nome <span class="req" aria-hidden="true">*</span></label>
        <input class="input" id="nome" type="text" placeholder="Como devemos te chamar?" value="Raphael Oliveira">
        <span class="field-hint">Use seu nome completo.</span>
      </div>
      <div class="field">
        <label class="field-label" for="empresa">Empresa <span class="req" aria-hidden="true">*</span></label>
        <input class="input is-invalid" id="empresa" type="text" value="Nexus" aria-invalid="true" aria-describedby="empresa-erro" required>
        <span class="field-error" id="empresa-erro" role="alert">Informe a razão social da sua empresa.</span>
      </div>
    </div>
    <div class="col">
      <div class="field">
        <label class="field-label" for="setor">Setor principal</label>
        <select class="select" id="setor">
          <option>Indústria</option>
          <option>Logística</option>
          <option selected>Varejo</option>
          <option>Serviços financeiros</option>
        </select>
        <span class="field-hint">Escolha o setor que mais consome tempo da operação.</span>
      </div>
      <div class="field">
        <label class="field-label" for="email-disabled">E-mail para contato</label>
        <input class="input" id="email-disabled" type="email" value="ops@nexus.ai" disabled>
        <span class="field-hint">Confirmaremos após validar o CNPJ.</span>
      </div>
    </div>
  </div>
</div>

<hr class="divider">

<div class="row">
  <span class="label">Contexto</span>
  <div class="field full">
    <label class="field-label" for="tempo">Onde sua operação perde tempo hoje? <span class="req" aria-hidden="true">*</span></label>
    <textarea class="textarea" id="tempo" rows="4" placeholder="Descreva em poucas linhas o gargalo principal — por exemplo: retrabalho, planilhas paralelas, espera por aprovações.">Hoje perdemos cerca de 3 horas por dia consolidando pedidos em três planilhas diferentes antes de liberar a produção.</textarea>
    <span class="field-hint">Quanto mais específico, melhor será a recomendação inicial.</span>
  </div>
</div>

</body>
</html>
