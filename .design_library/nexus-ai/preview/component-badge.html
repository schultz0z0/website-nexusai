<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Badge</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { margin: 0; padding: 12px; background: var(--color-background); color: var(--color-foreground); font-family: var(--font-sans); }
.row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
.label { font-family: var(--font-sans); font-size: var(--type-eyebrow); font-weight: var(--font-weight-semibold); text-transform: uppercase; letter-spacing: var(--letter-spacing-marquee-label); color: var(--color-muted-foreground); min-width: 92px; flex-shrink: 0; }
.divider { border: 0; border-top: 1px solid var(--color-border); margin: 12px 0; }
/* @component-css-start */
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; min-height: 24px; min-width: 24px; font-family: var(--font-sans); font-size: var(--font-size-eyebrow); font-weight: var(--font-weight-semibold); text-transform: uppercase; letter-spacing: var(--letter-spacing-marquee-label); white-space: nowrap; border: 1px solid transparent; flex-shrink: 0; }
.badge-neutral-solid { background: var(--color-foreground); color: var(--color-background); border-color: var(--color-foreground); border-radius: var(--radius-md); }
.badge-signal-subtle { background: var(--nexus-signal-soft); color: var(--nexus-signal); border-color: var(--nexus-signal-soft); border-radius: var(--radius-md); }
.badge-status-on { background: var(--nexus-signal); color: var(--color-background); border-color: var(--nexus-signal); border-radius: var(--radius-full); }
.badge-status-soft { background: var(--color-accent); color: var(--nexus-signal); border-color: var(--color-border); border-radius: var(--radius-full); }
.dot { width: 8px; height: 8px; border-radius: var(--radius-full); background: var(--color-background); flex-shrink: 0; display: inline-block; }
/* @component-css-end */
</style>
</head>
<body>
<div class="row">
  <span class="label">Variantes</span>
  <span class="badge badge-neutral-solid">NEXUS AI</span>
  <span class="badge badge-signal-subtle">DIAGNÓSTICO</span>
</div>
<hr class="divider">
<div class="row">
  <span class="label">Status</span>
  <span class="badge badge-status-on"><span class="dot"></span>EM PRODUÇÃO</span>
  <span class="badge badge-status-soft">STACK ABERTA</span>
</div>
</body>
</html>
