name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Unit tests
        run: npm run test:unit

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Responsive browser matrix
        env:
          PLAYWRIGHT_USE_PRODUCTION_BUILD: "1"
        run: npm run test:responsive -- --project=chromium --workers=4

      - name: Upload responsive failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-browser-failures
          path: .next/playwright-test-results
          if-no-files-found: ignore
          retention-days: 7
